name: Liquidación automática de LaLiga

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "sports_results.py"
      - "prediction_core.py"
      - "liquidar_laliga.py"
      - "liquidar_champions.py"
      - "scripts/auditar_reconciliacion.py"
      - ".github/workflows/liquidar-laliga.yml"
      - ".github/workflows/liquidar-champions.yml"

permissions:
  contents: write

concurrency:
  group: predicciones-main
  cancel-in-progress: false

jobs:
  liquidar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy streamlit

      - name: Reparar esquema mixto del historial
        run: python scripts/reparar_csv_predicciones.py

      - name: Comprobar resultados oficiales y liquidar pendientes
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python liquidar_laliga.py
      - name: Guardar resultados y reconciliación sin modificar pronósticos
        env:
          CLAVE: ${{ secrets.CLAVE }}
          KALSHI_SETTLEMENT_GRACE_HOURS: ${{ vars.KALSHI_SETTLEMENT_GRACE_HOURS || '72' }}
          MATCH_LOOKUP_GRACE_HOURS: ${{ vars.MATCH_LOOKUP_GRACE_HOURS || '6' }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          # Reconcile before staging/committing so no generated file is left unstaged
          # while retrying a push. This avoids the previous "cannot pull with rebase"
          # failure and keeps results plus the pending audit in one consistent commit.
          python scripts/auditar_reconciliacion.py
          # The CSV repair step may normalize histories across sports. Stage every
          # generated prediction/result/audit output so retries never see unstaged files.
          git add predicciones_laliga.csv predicciones_champions.csv predicciones_mlb.csv predicciones_nfl.csv resultados_laliga.csv resultados_champions.csv resultados_mlb.csv resultados_nfl.csv reconciliacion_pendientes.csv auditoria_reconciliacion_actual.csv
          if ! git diff --cached --quiet; then
            git commit -m "Liquidar y reconciliar pronósticos de LaLiga"
            pushed=false
            for intento in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              sleep $((intento * 3))
            done
            if [ "$pushed" != true ]; then exit 1; fi
          fi
