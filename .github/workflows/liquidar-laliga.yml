name: Liquidación automática de LaLiga

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predicciones-main
  cancel-in-progress: false

jobs:
  liquidar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy streamlit

      - name: Reparar esquema mixto del historial
        run: python scripts/reparar_csv_predicciones.py

      - name: Comprobar resultados oficiales y liquidar pendientes
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python liquidar_laliga.py
      - name: Generar reconciliación de todas las competiciones
        if: always()
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python scripts/auditar_reconciliacion.py

      - name: Guardar resultados sin modificar pronósticos
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_laliga.csv resultados_laliga.csv reconciliacion_pendientes.csv
          if git diff --cached --quiet; then
            echo "No hay resultados nuevos"
          else
            git commit -m "Liquidar pronósticos finalizados de LaLiga"
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort || true
              sleep $((intento * 3))
            done
            exit 1
          fi
