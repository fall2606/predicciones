name: Pruebas de recuperación de liquidación de fútbol

on:
  push:
    branches: [fix/football-settlement-side-recovery]
  pull_request:
    branches: [main]
    paths:
      - "prediction_core.py"
      - "scripts/auditar_reconciliacion.py"
      - "tests/**"
      - ".github/workflows/football-side-recovery-tests.yml"

permissions:
  contents: read

concurrency:
  group: football-side-recovery-tests
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias del proyecto
        run: python -m pip install requests pandas numpy scipy streamlit
      - name: Comprobar sintaxis de módulos y páginas
        run: python -m compileall -q prediction_core.py sports_results.py laliga_engine.py champions_engine.py scripts/auditar_reconciliacion.py pages/LaLiga.py pages/Champions.py pages/MLB.py
      - name: Ejecutar todas las pruebas unitarias y de regresión
        run: python -m unittest discover -s tests -v
