name: Validar liquidación de predicciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Comprobar sintaxis
        run: python -m py_compile prediction_core.py sports_results.py liquidar_laliga.py liquidar_champions.py liquidar_mlb.py scripts/auditar_reconciliacion.py
      - name: Probar liquidación por marcador independiente
        run: python -m unittest discover -s tests -v
