name: Validación NFL por fases
on:
  push:
    branches: ["feature/nfl-kalshi"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-nfl
  cancel-in-progress: false
jobs:
  nfl-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Fase 1 — compilar catálogo y motores
        run: python -m compileall -q .
      - name: Fase 1 — pruebas unitarias y regresiones
        run: python -m unittest discover -s tests -v
      - name: Fase 1 — importar motores como Python/Streamlit
        run: |
          python - <<'PY'
          import champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results
          print("IMPORT_OK: champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results")
          PY
      - name: Fase 1 — catálogo público completo de NFL en Kalshi
        timeout-minutes: 4
        run: python scripts/verify_nfl_catalog.py
      - name: Fase 2 — comprobar captura y liquidación con contrato real
        timeout-minutes: 8
        run: python scripts/verify_nfl_cycle.py
      - name: Fase 3 — importar y ejecutar todas las páginas Streamlit con los CSV reales
        timeout-minutes: 8
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: |
          mkdir -p .streamlit
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(".streamlit/secrets.toml").write_text("CLAVE = " + json.dumps(os.getenv("CLAVE", "")) + "\n", encoding="utf-8")
          PY
          python scripts/verify_streamlit_pages.py
      - name: Fase 4 — backtest NFL y calibración por mercado
        timeout-minutes: 6
        run: python scripts/backtest_nfl.py --max-games 500 --force
      - name: Fase 4 — comprobar API Kalshi y liquidación compartida existente
        timeout-minutes: 5
        run: |
          python scripts/verificar_api_kalshi.py
          python scripts/verificar_liquidacion_real.py
      - name: Guardar evidencia del backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-verificacion-evidencia
          path: |
            nfl_backtest_resumen.csv
            nfl_calibracion.json
            nfl_catalogo_actual.csv
            nfl_catalogo_verificacion.csv
            nfl_candidatos_descartados.csv
            nfl_cobertura_por_partido.csv
          if-no-files-found: warn
