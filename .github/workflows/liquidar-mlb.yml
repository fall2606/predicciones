name: Liquidación automática MLB
on:
  push:
    branches: [main]
    paths:
      - "prediction_core.py"
      - "liquidar_mlb.py"
      - ".github/workflows/liquidar-mlb.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: predicciones-main
  cancel-in-progress: false
jobs:
  liquidar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia HTTP
        run: python -m pip install requests
      - name: Liquidar contratos cerrados por Kalshi
        run: python liquidar_mlb.py
      - name: Guardar solo resultados nuevos
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add resultados_mlb.csv
          if git diff --cached --quiet; then
            echo "No hay resultados nuevos"
          else
            git commit -m "Liquidar contratos MLB según Kalshi"
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort || true
              sleep $((intento * 3))
            done
            exit 1
          fi
