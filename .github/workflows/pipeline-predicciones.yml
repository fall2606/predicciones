name: Pipeline automático de predicciones
on:
  push:
    branches: [main]
    paths:
      - "prediction_core.py"
      - "mlb_engine.py"
      - "registrar_laliga.py"
      - "registrar_champions.py"
      - "liquidar_mlb.py"
      - "liquidar_laliga.py"
      - "liquidar_champions.py"
      - "laliga_engine.py"
      - "champions_engine.py"
      - "pages/MLB.py"
      - "pages/LaLiga.py"
      - "pages/Champions.py"
      - ".github/workflows/pipeline-predicciones.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: predicciones-main
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias compartidas
        run: python -m pip install requests pandas numpy scipy streamlit
      - name: Comprobar sintaxis de todo el sistema
        run: python -m compileall -q prediction_core.py mlb_engine.py registrar_laliga.py registrar_champions.py liquidar_mlb.py liquidar_laliga.py liquidar_champions.py pages/MLB.py pages/LaLiga.py pages/Champions.py
      - name: Capturar MLB antes del partido
        run: python mlb_engine.py
      - name: Capturar LaLiga antes del partido
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python registrar_laliga.py
      - name: Capturar Champions antes del partido
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python registrar_champions.py
      - name: Liquidar todos los contratos MLB
        run: python liquidar_mlb.py
      - name: Liquidar todos los contratos LaLiga
        run: python liquidar_laliga.py
      - name: Liquidar todos los contratos Champions
        run: python liquidar_champions.py
      - name: Guardar predicciones y resultados en un único commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_mlb.csv resultados_mlb.csv predicciones_laliga.csv resultados_laliga.csv predicciones_champions.csv resultados_champions.csv
          if git diff --cached --quiet; then
            echo "No hay filas nuevas; los historiales permanecen sin cambios"
            exit 0
          fi
          git commit -m "Actualizar predicciones y liquidaciones oficiales"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((intento * 3))
          done
          exit 1
