name: Pipeline automático de predicciones
on:
  push:
    branches: [main]
    paths:
      - "prediction_core.py"
      - "sports_results.py"
      - "reconciliacion_ui.py"
      - "mlb_engine.py"
      - "mlb_math.py"
      - "scripts/reparar_csv_predicciones.py"
      - "scripts/reintegrar_capturas_mlb.py"
      - "scripts/auditar_reconciliacion.py"
      - "scripts/auditar_calidad_pronosticos.py"
      - "scripts/backtest_mlb.py"
      - "scripts/medir_timing_workflow.py"
      - "tests/**"
      - "registrar_laliga.py"
      - "registrar_champions.py"
      - "liquidar_mlb.py"
      - "liquidar_laliga.py"
      - "liquidar_champions.py"
      - "laliga_engine.py"
      - "champions_engine.py"
      - "pages/MLB.py"
      - "pages/LaLiga.py"
      - "pages/Champions.py"
      - "pages/NFL.py"
      - "pages/Contexto_deportivo.py"
      - "sports_context_reasoner.py"
      - "app.py"
      - ".github/workflows/pipeline-predicciones.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: predicciones-main
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sincronizar con main antes de procesar
        run: git pull --rebase origin main
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias compartidas
        run: python -m pip install requests pandas numpy scipy streamlit
      - name: Medir desfase de GitHub Actions y cola
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/medir_timing_workflow.py
      - name: Reparar esquema mixto de historiales existentes
        run: python scripts/reparar_csv_predicciones.py
      - name: Comprobar sintaxis de todo el sistema
        run: python -m compileall -q app.py sports_context_reasoner.py sports_results.py reconciliacion_ui.py prediction_core.py mlb_engine.py mlb_math.py nfl_engine.py scripts/reparar_csv_predicciones.py scripts/reintegrar_capturas_mlb.py scripts/backtest_mlb.py scripts/medir_timing_workflow.py scripts/auditar_reconciliacion.py registrar_laliga.py registrar_champions.py liquidar_mlb.py liquidar_laliga.py liquidar_champions.py laliga_engine.py champions_engine.py pages/MLB.py pages/NFL.py pages/LaLiga.py pages/Champions.py pages/Contexto_deportivo.py
      - name: Ejecutar pruebas unitarias y regresiones
        run: python -m unittest discover -s tests -v
      - name: Capturar MLB antes del partido
        id: capture_mlb
        timeout-minutes: 3
        continue-on-error: true
        run: python mlb_engine.py
      - name: Capturar LaLiga antes del partido
        id: capture_laliga
        timeout-minutes: 2
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python registrar_laliga.py
      - name: Capturar Champions antes del partido
        id: capture_champions
        timeout-minutes: 2
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python registrar_champions.py
      - name: Reintegrar capturas MLB históricas recuperadas
        id: restore_mlb
        if: always()
        continue-on-error: true
        run: python scripts/reintegrar_capturas_mlb.py
      - name: Liquidar todos los contratos MLB
        id: liquidate_mlb
        if: always()
        continue-on-error: true
        run: python liquidar_mlb.py
      - name: Calcular Brier MLB por tipo de mercado
        id: backtest_mlb
        if: always()
        continue-on-error: true
        run: python scripts/backtest_mlb.py
      - name: Liquidar todos los contratos LaLiga
        id: liquidate_laliga
        if: always()
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python liquidar_laliga.py
      - name: Liquidar todos los contratos Champions
        id: liquidate_champions
        if: always()
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python liquidar_champions.py
      - name: Reconciliar predicciones de partidos finalizados
        id: audit_reconciliation
        if: always()
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
          KALSHI_SETTLEMENT_GRACE_HOURS: ${{ vars.KALSHI_SETTLEMENT_GRACE_HOURS || '72' }}
          MATCH_LOOKUP_GRACE_HOURS: ${{ vars.MATCH_LOOKUP_GRACE_HOURS || '6' }}
        run: python scripts/auditar_reconciliacion.py
      - name: Generar auditoría de calidad después de liquidar y reconciliar
        id: audit_quality
        if: always()
        continue-on-error: true
        run: python scripts/auditar_calidad_pronosticos.py
      - name: Guardar predicciones y resultados en un único commit
        id: commit_results
        if: always()
        continue-on-error: true
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_mlb.csv resultados_mlb.csv predicciones_laliga.csv resultados_laliga.csv predicciones_champions.csv resultados_champions.csv predicciones_nfl.csv resultados_nfl.csv scripts/reintegrar_capturas_mlb.py scripts/auditar_reconciliacion.py scripts/backtest_mlb.py backtest_mlb_resumen.csv reconciliacion_pendientes.csv mlb_eventos_sin_emparejar.csv mlb_candidatos_descartados.csv mlb_cobertura_por_partido.csv mlb_probabilidades_actuales.csv auditoria_calidad_actual.csv auditoria_calidad_actual.json auditoria_reconciliacion_actual.csv
          if git diff --cached --quiet; then
            echo "No hay filas nuevas; los historiales permanecen sin cambios"
            exit 0
          fi
          git commit -m "Actualizar predicciones y liquidaciones oficiales"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((intento * 3))
          done
          exit 1

      - name: Informar errores después de intentar todas las liquidaciones
        if: always()
        env:
          CAPTURE_MLB: ${{ steps.capture_mlb.outcome }}
          CAPTURE_LALIGA: ${{ steps.capture_laliga.outcome }}
          CAPTURE_CHAMPIONS: ${{ steps.capture_champions.outcome }}
          RESTORE_MLB: ${{ steps.restore_mlb.outcome }}
          AUDIT_RECONCILIATION: ${{ steps.audit_reconciliation.outcome }}
          AUDIT_QUALITY: ${{ steps.audit_quality.outcome }}
          BACKTEST_MLB: ${{ steps.backtest_mlb.outcome }}
          LIQUIDATE_MLB: ${{ steps.liquidate_mlb.outcome }}
          LIQUIDATE_LALIGA: ${{ steps.liquidate_laliga.outcome }}
          LIQUIDATE_CHAMPIONS: ${{ steps.liquidate_champions.outcome }}
          COMMIT_RESULTS: ${{ steps.commit_results.outcome }}
        run: |
          for result in "$CAPTURE_MLB" "$CAPTURE_LALIGA" "$CAPTURE_CHAMPIONS" "$RESTORE_MLB" "$AUDIT_RECONCILIATION" "$AUDIT_QUALITY" "$BACKTEST_MLB" "$LIQUIDATE_MLB" "$LIQUIDATE_LALIGA" "$LIQUIDATE_CHAMPIONS" "$COMMIT_RESULTS"; do
            if [ "$result" != "success" ]; then
              echo "::error::Una tarea del pipeline falló: $result"
              exit 1
            fi
          done
