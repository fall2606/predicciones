name: Liquidación automática de Champions League

on:
  workflow_dispatch:
  schedule:
    - cron: "5-59/10 * * * *"
  push:
    branches: [main]
    paths:
      - "sports_results.py"
      - "prediction_core.py"
      - "liquidar_laliga.py"
      - "liquidar_champions.py"
      - "scripts/auditar_reconciliacion.py"
      - ".github/workflows/liquidar-laliga.yml"
      - ".github/workflows/liquidar-champions.yml"

permissions:
  contents: write

concurrency:
  group: predicciones-main
  cancel-in-progress: false

jobs:
  liquidar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy streamlit

      - name: Reparar esquema mixto del historial
        run: python scripts/reparar_csv_predicciones.py

      - name: Revisar resultados oficiales y liquidar pendientes
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python liquidar_champions.py
      - name: Guardar resultados y reconciliación sin modificar pronósticos
        env:
          CLAVE: ${{ secrets.CLAVE }}
          KALSHI_SETTLEMENT_GRACE_HOURS: ${{ vars.KALSHI_SETTLEMENT_GRACE_HOURS || '72' }}
          MATCH_LOOKUP_GRACE_HOURS: ${{ vars.MATCH_LOOKUP_GRACE_HOURS || '6' }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_champions.csv resultados_champions.csv
          if ! git diff --cached --quiet; then
            git commit -m "Liquidar pronósticos finalizados de Champions League"
            pushed=false
            for intento in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              git rebase --abort || true
              sleep $((intento * 3))
            done
            if [ "$pushed" != true ]; then exit 1; fi
          fi
          # Reconciliar DESPUÉS de sincronizar y publicar los resultados. Así ambos
          # liquidadores no compiten por subir versiones obsoletas del mismo informe.
          git fetch origin main
          git reset --hard origin/main
          python scripts/auditar_reconciliacion.py
          git add reconciliacion_pendientes.csv
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar reconciliación tras liquidación de fútbol"
            pushed=false
            for intento in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
              git rebase --abort || true
              sleep $((intento * 3))
            done
            if [ "$pushed" != true ]; then exit 1; fi
          fi
