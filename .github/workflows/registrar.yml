name: Registrar predicciones

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registrar-predicciones
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy

      - name: Registrar predicciones
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: python registrar.py

      - name: Guardar historial
        shell: bash
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones.csv

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi

          git commit -m "Actualizar historial"

          for intento in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Historial guardado"
              exit 0
            fi

            echo "Push rechazado; intentando integrar los cambios más recientes"
            sleep 2
          done

          echo "No se pudo actualizar main después de 3 intentos"
          exit 1
