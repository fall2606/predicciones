name: Verificación NFL y regresión del proyecto
on:
  push:
    branches: ["feature/nfl-kalshi-model"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:


jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Sintaxis de todos los módulos y páginas
        run: python -m compileall -q .
      - name: Importación de todos los motores
        run: |
          python - <<'PY'
          import champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results
          print("IMPORT_OK: champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results")
          PY
      - name: Carga de CSV reales de todas las competiciones
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          required = {
              "LaLiga": ("predicciones_laliga.csv", "resultados_laliga.csv"),
              "Champions": ("predicciones_champions.csv", "resultados_champions.csv"),
              "MLB": ("predicciones_mlb.csv", "resultados_mlb.csv"),
              "NFL": ("predicciones_nfl.csv", "resultados_nfl.csv"),
          }
          for sport, paths in required.items():
              for name in paths:
                  path = Path(name)
                  if not path.exists():
                      if sport == "NFL":
                          continue
                      raise AssertionError(f"{sport}: falta CSV existente {name}")
                  with path.open(newline="", encoding="utf-8-sig") as f:
                      rows = list(csv.DictReader(f))
                  print(f"CSV_OK {sport}/{name}: {len(rows)} registros")
          PY
      - name: Carga real de las cuatro páginas Streamlit
        timeout-minutes: 6
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: |
          mkdir -p .streamlit
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(".streamlit/secrets.toml").write_text("CLAVE = " + json.dumps(os.getenv("CLAVE", "")) + "\n", encoding="utf-8")
          PY
          python scripts/verify_streamlit_pages.py
      - name: Pruebas de regresión NFL
        run: python -m pytest -q tests/test_nfl_engine.py
      - name: Backtest NFL walk-forward y calibración por mercado
        timeout-minutes: 5
        run: python scripts/backtest_nfl.py --max-games 500 --force
      - name: Guardar evidencia de backtest NFL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-backtest-evidence
          path: |
            nfl_backtest_resumen.csv
            nfl_calibracion.json
          if-no-files-found: warn
      - name: Ciclo NFL real: captura próxima, congelado y liquidación histórica
        timeout-minutes: 8
        run: python scripts/verify_nfl_cycle.py
