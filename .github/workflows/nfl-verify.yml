name: Verificación NFL y regresión del proyecto

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/nfl-kalshi-model]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compilar todos los módulos y páginas
        run: python -m compileall -q .
      - name: Importar todos los motores
        run: |
          python - <<'PY'
          import champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results
          print("IMPORT_OK: champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results")
          PY
      - name: AppTest de todas las páginas con CSV reales
        timeout-minutes: 6
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: |
          mkdir -p .streamlit
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(".streamlit/secrets.toml").write_text("CLAVE = " + json.dumps(os.getenv("CLAVE", "")) + "\n", encoding="utf-8")
          PY
          python scripts/verify_streamlit_pages.py
      - name: Regresiones NFL
        run: python -m pytest -q tests/test_nfl_engine.py
      - name: Backtest NFL walk-forward y calibración por mercado
        timeout-minutes: 5
        run: python scripts/backtest_nfl.py --max-games 500 --force
      - name: Guardar evidencia del backtest NFL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-backtest-evidence
          path: |
            nfl_backtest_resumen.csv
            nfl_calibracion.json
          if-no-files-found: warn
      - name: Ciclo NFL real: captura, congelado y liquidación histórica
        timeout-minutes: 8
        run: python scripts/verify_nfl_cycle.py
