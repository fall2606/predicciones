name: NFL - capturar, liquidar y recalibrar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nfl_engine.py"
      - "liquidar_nfl.py"
      - "probability_calibration.py"
      - "prediction_core.py"
      - "pages/NFL.py"
      - "tests/test_nfl_engine.py"
      - ".github/workflows/nfl-predicciones.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: nfl-predicciones-main
  cancel-in-progress: false
jobs:
  nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy streamlit
      - name: Comprobar sintaxis NFL
        run: python -m py_compile nfl_engine.py liquidar_nfl.py pages/NFL.py tests/test_nfl_engine.py
      - name: Ejecutar pruebas NFL
        run: python -m unittest tests.test_nfl_engine -v
      - name: Capturar mercados NFL abiertos
        id: capture
        continue-on-error: true
        run: python nfl_engine.py
      - name: Liquidar resultados oficiales Kalshi NFL
        id: settle
        if: always()
        continue-on-error: true
        run: python liquidar_nfl.py
      - name: Guardar ledger NFL sin modificar otros históricos
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_nfl.csv resultados_nfl.csv nfl_probabilidades_actuales.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin nuevas capturas o liquidaciones NFL; el historial existente permanece intacto"
            exit 0
          fi
          git commit -m "Actualizar capturas y resultados NFL"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((intento * 3))
          done
          exit 1
