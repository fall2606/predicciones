name: Verificación del sistema de predicciones
on:
  push:
    branches: [main, "feature/nfl-final-verification-v2"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-predicciones
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy streamlit pytest
      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v
      - name: Compilar todos los motores y páginas
        run: python -m compileall -q .
      - name: Importar todos los motores
        run: |
          python - <<'PY'
          import champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results
          print("IMPORT_OK: champions_engine, laliga_engine, mlb_engine, nfl_engine, prediction_core, sports_results")
          PY
      - name: Regresiones NFL
        run: python -m pytest -q tests/test_nfl_engine.py
      - name: AppTest de las cuatro páginas y lectura de CSV reales
        timeout-minutes: 6
        env:
          CLAVE: ${{ secrets.CLAVE }}
        run: |
          mkdir -p .streamlit
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(".streamlit/secrets.toml").write_text("CLAVE = " + json.dumps(os.getenv("CLAVE", "")) + "\n", encoding="utf-8")
          PY
          python scripts/verify_streamlit_pages.py
      - name: Backtest NFL walk-forward y calibración
        timeout-minutes: 5
        run: python scripts/backtest_nfl.py --max-games 500 --force
      - name: Evidencia del backtest NFL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-backtest-evidence
          path: |
            nfl_backtest_resumen.csv
            nfl_calibracion.json
          if-no-files-found: warn
      - name: Ciclo NFL real: captura, congelado y liquidación histórica
        timeout-minutes: 8
        run: python scripts/verify_nfl_cycle.py
      - name: Verificar catálogo público real de Kalshi
        run: python scripts/verificar_api_kalshi.py
      - name: Verificar liquidación con contratos reales ya cerrados (MLB, LaLiga y Champions)
        run: python scripts/verificar_liquidacion_real.py
