name: Verificación del sistema de predicciones
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-predicciones
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy streamlit
      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v
      - name: Generar auditoría reproducible de calidad desde los CSV archivados
        run: python scripts/auditar_calidad_pronosticos.py
      - name: Guardar informe de auditoría como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-calidad-pronosticos
          path: |
            auditoria_calidad_actual.csv
            auditoria_calidad_actual.json
            auditoria_reconciliacion_actual.csv
          if-no-files-found: error
          retention-days: 30
      - name: Verificar catálogo público real de Kalshi
        run: python scripts/verificar_api_kalshi.py
      - name: Verificar liquidación con contratos reales ya cerrados (MLB, LaLiga y Champions)
        run: python scripts/verificar_liquidacion_real.py
