name: Historial inmutable MLB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predicciones-main
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy
      - name: Reparar esquema mixto del historial
        run: python scripts/reparar_csv_predicciones.py
      - name: Capturar predicciones y liquidar contratos
        run: python registrar_mlb.py
      - name: Generar reconciliación de todas las competiciones
        if: always()
        continue-on-error: true
        env:
          CLAVE: ${{ secrets.CLAVE }}
          KALSHI_SETTLEMENT_GRACE_HOURS: ${{ vars.KALSHI_SETTLEMENT_GRACE_HOURS || '72' }}
          MATCH_LOOKUP_GRACE_HOURS: ${{ vars.MATCH_LOOKUP_GRACE_HOURS || '6' }}
        run: python scripts/auditar_reconciliacion.py
      - name: Guardar únicamente filas nuevas
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_laliga.csv predicciones_champions.csv predicciones_mlb.csv predicciones_nfl.csv resultados_laliga.csv resultados_champions.csv resultados_mlb.csv resultados_nfl.csv reconciliacion_pendientes.csv auditoria_reconciliacion_actual.csv mlb_eventos_sin_emparejar.csv mlb_candidatos_descartados.csv mlb_cobertura_por_partido.csv mlb_probabilidades_actuales.csv
          if git diff --cached --quiet; then
            echo "No hay capturas ni resultados nuevos"
          else
            git commit -m "Actualizar historial inmutable MLB"
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort || true
              sleep $((intento * 3))
            done
            exit 1
          fi
