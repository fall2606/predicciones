name: Historial inmutable MLB

on:
  push:
    branches: [main]
    paths:
      - "registrar_mlb.py"
      - "mlb_engine.py"
      - ".github/workflows/registrar-mlb.yml"
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guardar-historicos-mlb
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests pandas numpy scipy
      - name: Capturar predicciones y liquidar contratos
        run: python registrar_mlb.py
      - name: Guardar únicamente filas nuevas
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add predicciones_mlb.csv resultados_mlb.csv
          if git diff --cached --quiet; then
            echo "No hay capturas ni resultados nuevos"
          else
            git commit -m "Actualizar historial inmutable MLB"
            git pull --rebase origin main
            git push origin main
          fi
